<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iris Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 24px; }
        main { max-width: 520px; margin: 0 auto; }
        form, .result { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 12px; color: #555; }
        input[type="number"] { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 16px; padding: 10px 16px; background: #2f6f4f; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 16px; display: none; }
        .error { color: #b91c1c; }
        img { max-width: 100%; margin-top: 12px; border-radius: 4px; }
        table { border-collapse: collapse; margin-top: 8px; }
        td { padding: 4px 12px 4px 0; }
    </style>
</head>
<body>
<main>
    <h1>Iris Classifier</h1>
    <form id="form">
        <label for="sepal_length">Sepal length (cm)</label>
        <input type="number" id="sepal_length" name="sepal_length" step="0.1" value="5.1" required>
        <label for="sepal_width">Sepal width (cm)</label>
        <input type="number" id="sepal_width" name="sepal_width" step="0.1" value="3.5" required>
        <label for="petal_length">Petal length (cm)</label>
        <input type="number" id="petal_length" name="petal_length" step="0.1" value="1.4" required>
        <label for="petal_width">Petal width (cm)</label>
        <input type="number" id="petal_width" name="petal_width" step="0.1" value="0.2" required>
        <button type="submit">Predict</button>
    </form>

    <div class="result" id="result">
        <h2 id="label"></h2>
        <table id="probabilities"></table>
        <img id="photo" alt="Iris flower">
    </div>
</main>
<script>
    document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = {};
        for (const field of ["sepal_length", "sepal_width", "petal_length", "petal_width"]) {
            body[field] = document.getElementById(field).value;
        }
        const result = document.getElementById("result");
        const label = document.getElementById("label");
        const table = document.getElementById("probabilities");
        const photo = document.getElementById("photo");
        const response = await fetch("/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body),
        });
        const data = await response.json();
        result.style.display = "block";
        table.innerHTML = "";
        if (!response.ok) {
            label.textContent = data.error;
            label.className = "error";
            photo.style.display = "none";
            return;
        }
        label.textContent = "Predicted class: " + data.predicted_class;
        label.className = "";
        for (const [name, p] of Object.entries(data.probabilities)) {
            const row = table.insertRow();
            row.insertCell().textContent = name;
            row.insertCell().textContent = (p * 100).toFixed(1) + "%";
        }
        photo.src = "/static/" + data.predicted_class.toLowerCase() + ".jpeg";
        photo.style.display = "block";
    });
</script>
</body>
</html>
