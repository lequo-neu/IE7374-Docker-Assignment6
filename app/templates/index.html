<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Penguin Species Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f5f8; color: #1f2937; margin: 0; padding: 24px; }
        main { max-width: 540px; margin: 0 auto; }
        form, .result { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 12px; color: #4b5563; }
        input[type="number"] { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { margin-top: 16px; padding: 10px 16px; background: #1e4e79; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 16px; display: none; }
        .error { color: #b91c1c; }
        .row { display: flex; align-items: center; margin-top: 8px; }
        .name { width: 90px; }
        .track { flex: 1; background: #e5e7eb; border-radius: 4px; height: 14px; margin: 0 10px; }
        .bar { background: #1e4e79; height: 14px; border-radius: 4px; }
        .value { width: 56px; text-align: right; }
        .note { color: #6b7280; font-size: 14px; }
    </style>
</head>
<body>
<main>
    <h1>Penguin Species Classifier</h1>
    <p class="note">Enter the measurements of a penguin from the Palmer Archipelago.</p>
    <form id="form">
        <label for="bill_length_mm">Bill length (mm)</label>
        <input type="number" id="bill_length_mm" step="0.1" value="39.1" required>
        <label for="bill_depth_mm">Bill depth (mm)</label>
        <input type="number" id="bill_depth_mm" step="0.1" value="18.7" required>
        <label for="flipper_length_mm">Flipper length (mm)</label>
        <input type="number" id="flipper_length_mm" step="1" value="181" required>
        <label for="body_mass_g">Body mass (g)</label>
        <input type="number" id="body_mass_g" step="1" value="3750" required>
        <button type="submit">Predict</button>
    </form>

    <div class="result" id="result">
        <h2 id="label"></h2>
        <div id="probabilities"></div>
    </div>
</main>
<script>
    const FIELDS = ["bill_length_mm", "bill_depth_mm", "flipper_length_mm", "body_mass_g"];
    document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = {};
        for (const field of FIELDS) {
            body[field] = document.getElementById(field).value;
        }
        const result = document.getElementById("result");
        const label = document.getElementById("label");
        const list = document.getElementById("probabilities");
        const response = await fetch("/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body),
        });
        const data = await response.json();
        result.style.display = "block";
        list.innerHTML = "";
        if (!response.ok) {
            label.textContent = data.error;
            label.className = "error";
            return;
        }
        label.textContent = "Predicted species: " + data.predicted_species;
        label.className = "";
        for (const [name, p] of Object.entries(data.probabilities)) {
            const row = document.createElement("div");
            row.className = "row";
            const percent = (p * 100).toFixed(1);
            row.innerHTML = '<span class="name"></span><span class="track"><span class="bar"></span></span><span class="value"></span>';
            row.querySelector(".name").textContent = name;
            row.querySelector(".bar").style.width = percent + "%";
            row.querySelector(".bar").style.display = "block";
            row.querySelector(".value").textContent = percent + "%";
            list.appendChild(row);
        }
    });
</script>
</body>
</html>
